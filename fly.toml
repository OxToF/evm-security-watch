# Fly.io config for the EVM Watchdog scan backend. First time:
#   fly launch --no-deploy --copy-config --name evm-watchdog-scan
#   fly volume create evmwdata -r cdg -n 1 -s 1
#   fly secrets set ADMIN_TOKEN=... MERCHANT_WALLET=0x... EVM_RPC_URL=... RESEND_API_KEY=... MAIL_FROM=... ALLOW_ORIGIN=... SUPPORT_EMAIL=...
#   fly deploy
app = "evm-watchdog-scan"
primary_region = "cdg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  JOBS_FILE = "/data/jobs.json"
  PUBLIC_BASE_URL = "https://evm-watchdog-scan.fly.dev"
  SCAN_PRICE_USD = "69"

[[mounts]]
  source = "evmwdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A scan runs after the payment is verified; the machine must not stop mid-job.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
